; =============================================================================
; CardputerZero - PlatformIO project configuration
;
; Target: M5Stack Cardputer Adv (ESP32-S3) + Cap CC1101 & NFC (SKU U219)
;
; The Cardputer Adv is a generic ESP32-S3 at the board level; M5Unified detects
; the exact variant (board_M5CardputerADV) at runtime, so we build against the
; stock esp32-s3-devkitc-1 board definition exactly like M5Stack's own libraries.
; =============================================================================

[env:cardputer-adv]
platform  = espressif32@6.12.0
board     = esp32-s3-devkitc-1
framework = arduino

; 8 MB flash part with a large app partition + FAT data region (see partitions.csv)
board_build.partitions   = partitions.csv
board_build.flash_mode   = qio
board_upload.flash_size  = 8MB
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
upload_speed  = 1500000

; USB in TinyUSB/OTG mode (ARDUINO_USB_MODE=0) so the USB-macro tool can present
; an HID keyboard; CDC-on-boot keeps Serial working over the same USB port.
; Build as C++17 (the core defaults to gnu++11, under which our `static inline`
; class members are only a GCC extension).
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=3
    ; IRremote: compile the send path by timer PWM; receiver stays enabled.
    -DSEND_PWM_BY_TIMER=1
    ; Room for long IR frames (some AV / AC remotes) when learning raw.
    -DRAW_BUFFER_LENGTH=500
    ; CRITICAL: the ESP32-S3's LED_BUILTIN is a NeoPixel driven over RMT. If
    ; IRremote's feedback LED is left enabled it toggles that NeoPixel from the
    ; receive ISR / send timing loop, which crashes (reboot to home) and wrecks
    ; send timing. Compile the feedback-LED code out entirely.
    -DNO_LED_FEEDBACK_CODE=1
    ; The Cap's CC1101 is a clone that reports a chip version RadioLib's begin()
    ; rejects (it only accepts 0x04/0x14/0x17/0x03; M5's own driver also allows
    ; 0x00/0x20). GODMODE exposes RadioLib internals so we can run begin()'s
    ; register setup WITHOUT the version gate (see subghz.cpp).
    -DRADIOLIB_GODMODE=1

; M5HAL/M5UnitUnified #include <Wire.h>/<SPI.h> without declaring them, and
; PlatformIO builds each library in isolation. This pre-build hook puts the
; framework's Wire/SPI headers on the global include path so every unit finds
; them (resolves the path itself - no hard-coded user directories).
extra_scripts = pre:inject_includes.py

lib_ldf_mode = deep+

; All libraries are the official upstream releases. Versions are pinned so a
; clean checkout builds reproducibly; bump them deliberately.
lib_deps =
    m5stack/M5Unified@^0.2.7
    m5stack/M5Cardputer@^1.1.1
    m5stack/M5Unit-NFC@^0.1.2
    jgromes/RadioLib@^7.8.1
    arduino-irremote/IRremote@^4.4.1
    ; Proven BLE HID keyboard library (Bluedroid, no NimBLE dep) - far more
    ; stable than a hand-rolled BLEHIDDevice for the BLE-keyboard mode.
    t-vk/ESP32 BLE Keyboard@^0.3.2
    ; Framework built-ins listed explicitly so the LDF puts them on every
    ; dependency's include path (M5HAL/M5UnitUnified #include <Wire.h>/<SPI.h>;
    ; the Wi-Fi guest portal uses WebServer + DNSServer).
    Wire
    SPI
    WiFi
    FS
    WebServer
    DNSServer
